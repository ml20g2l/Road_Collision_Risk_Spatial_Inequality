name: Full official-source rebuild

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Cache pinned source files
        uses: actions/cache@v4
        with:
          path: data/raw
          key: official-sources-2026-10-26-v1
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-lock.txt
      - name: Run clean-room pipeline
        run: python -m src.pipeline
      - name: Build and test dbt project
        run: dbt build --profiles-dir . --target dev
      - name: Generate dbt lineage documentation
        run: dbt docs generate --profiles-dir . --target dev
      - name: Upload reproducibility evidence
        uses: actions/upload-artifact@v4
        with:
          name: road-risk-rebuild-${{ github.run_id }}
          retention-days: 30
          path: |
            data/metadata/source_manifest.json
            data/processed/*.json
            data/processed/*.csv
            data/public/*.csv
            data/powerbi/model_contract.json
            target/catalog.json
            target/manifest.json
            target/run_results.json
            target/index.html
