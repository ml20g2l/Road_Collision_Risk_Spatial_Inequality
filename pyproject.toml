[tool.pytest.ini_options]
testpaths = ["tests_py"]
pythonpath = ["."]
addopts = "--strict-markers --disable-warnings --basetemp=.pytest_tmp"

[tool.coverage.run]
include = ["src/download_sources.py", "src/pipeline.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 60

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
